[workspace]
resolver = "2"
members = ["crates/engine", "crates/db", "crates/bot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ferogram = { git = "https://github.com/ankit-chaubey/ferogram", branch = "main", features = ["html"] }
diesel = { version = "=2.2.12", features = ["postgres", "chrono", "serde_json"] }
diesel-async = { version = "=0.5.2", features = ["postgres", "bb8", "async-connection-wrapper"] }
diesel_migrations = "=2.2.0"
tokio = { version = "1", features = ["full"] }
bytes = "1"
tokio-util = "0.7"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
regex = "1"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
indexmap = "2"

[profile.release]
lto = "thin"
codegen-units = 1
