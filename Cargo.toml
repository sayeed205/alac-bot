[workspace]
resolver = "2"
members = ["crates/engine", "crates/db", "crates/media", "crates/bot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ferogram = { git = "https://github.com/ankit-chaubey/ferogram", branch = "main", features = ["html"] }
diesel = { version = "2", features = ["postgres", "chrono", "serde_json"] }
diesel-async = { version = "0.9", features = ["postgres", "bb8", "async-connection-wrapper"] }
diesel_migrations = "2"
tokio = { version = "1", features = ["full"] }
bytes = "1"
tokio-util = "0.7"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
regex = "1"
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
indexmap = "2"
cuid2 = "0.1"
sha2 = "0.11"
symphonia = { version = "0.6", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav", "aiff", "pcm"] }
realfft = "3"
png = "0.18"
mp4ameta = "0.13"
font8x8 = "0.3"
temari = { git = "https://github.com/WorldObservationLog/Temari" }

[profile.release]
lto = "thin"
codegen-units = 1
