[workspace]
resolver = "2"
members = ["crates/engine", "crates/db", "crates/bot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# pinned deliberately: young crates, churn risk contained behind crate seams
# ferogram from git (docs track main; Cargo.lock pins the exact rev)
ferogram = { git = "https://github.com/ankit-chaubey/ferogram", branch = "main", features = ["html"] }
welds = { version = "=0.5.1", features = ["postgres", "migrations"] }
tokio = { version = "1", features = ["full"] }
bytes = "1"
tokio-util = "0.7"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
regex = "1"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
indexmap = "2"
sqlx = { version = "=0.9.0", features = ["runtime-tokio", "chrono"] }

[profile.release]
lto = "thin"
codegen-units = 1
